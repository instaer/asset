<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Spelling Bee hints preview</title>
  <desc id="desc">A compact preview showing a honeycomb letter grid, pangram hint, two-letter list, and grouped answer rows.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <pattern id="honeyWash" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#f7da21"/>
      <path d="M0 0h22l22 22v22H22L0 22z" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

