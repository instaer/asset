<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Strands path reveal preview</title>
  <desc id="desc">A compact abstract preview of a Strands letter grid with blue theme-word and yellow Spangram paths.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <pattern id="blueWash" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#e3f4f9"/>
      <path d="M0 0h22l22 22v22H22L0 22z" fill="#4a82c3" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <g filter="url(#softShadow)">
    <rect x="72" y="54" width="496" height="252" rx="10" fill="#ffffff"/>
  </g>

  <g transform="translate(104 78)">
