      <rect x="14" y="8" width="18" height="14" rx="3" fill="#ffffff" opacity="0.36"/>
      <text x="19" y="19" font-size="9" font-weight="800" opacity="0.58">B</text>
      <rect x="50" y="12" width="86" height="5" rx="2.5" opacity="0.23"/>
      <rect x="152" y="12" width="34" height="5" rx="2.5" opacity="0.18"/>
      <rect x="204" y="12" width="72" height="5" rx="2.5" opacity="0.14"/>
      <text x="384" y="20" font-size="13" font-weight="800" opacity="0.28">?</text>
    </g>

    <g transform="translate(0 120)">
      <rect width="432" height="30" rx="6" fill="#bc81c5"/>
      <rect x="14" y="8" width="18" height="14" rx="3" fill="#ffffff" opacity="0.30"/>
      <text x="19" y="19" font-size="9" font-weight="800" opacity="0.58">P</text>
      <text x="50" y="20" font-size="14" font-weight="800" opacity="0.28">? ? ?</text>
