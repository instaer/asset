      <rect x="14" y="8" width="18" height="14" rx="3" fill="#ffffff" opacity="0.34"/>
      <text x="19" y="19" font-size="9" font-weight="800" opacity="0.58">G</text>
      <rect x="50" y="12" width="62" height="5" rx="2.5" opacity="0.25"/>
      <circle cx="134" cy="15" r="3" opacity="0.24"/>
      <circle cx="151" cy="15" r="3" opacity="0.20"/>
      <circle cx="168" cy="15" r="3" opacity="0.16"/>
      <rect x="346" y="12" width="46" height="5" rx="2.5" opacity="0.20"/>
