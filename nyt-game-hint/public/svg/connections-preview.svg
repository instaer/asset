    <rect x="52" y="12" width="116" height="5" rx="2.5" fill="#202124" opacity="0.56"/>
    <rect x="52" y="24" width="204" height="4" rx="2" fill="#202124" opacity="0.16"/>
    <rect x="270" y="24" width="78" height="4" rx="2" fill="#202124" opacity="0.11"/>
  </g>

  <g transform="translate(104 142)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif" fill="#202124">
