      <rect x="50" y="12" width="104" height="5" rx="2.5" opacity="0.24"/>
      <rect x="174" y="12" width="54" height="5" rx="2.5" opacity="0.18"/>
      <circle cx="392" cy="15" r="3.2" opacity="0.32"/>
      <circle cx="408" cy="15" r="3.2" opacity="0.22"/>
