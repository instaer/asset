<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sudoku solver preview</title>
  <desc id="desc">A compact preview of a Sudoku solver board with candidates, reveal cell, and reveal box controls.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <pattern id="warmWash" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#f9df6d"/>
      <path d="M0 0h22l22 22v22H22L0 22z" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <g filter="url(#softShadow)">
    <rect x="72" y="54" width="496" height="252" rx="10" fill="#ffffff"/>
  </g>

  <rect x="104" y="82" width="432" height="196" rx="8" fill="url(#warmWash)"/>

  <g transform="translate(116 94)">
    <rect width="204" height="172" rx="8" fill="#ffffff" opacity="0.88"/>
    <g transform="translate(18 12)">
      <rect width="153" height="153" fill="#fffdf6"/>
      <rect x="102" y="51" width="51" height="51" fill="#fb9b00" opacity="0.16"/>
      <rect x="68" y="102" width="17" height="17" fill="#1976d2" opacity="0.12"/>

      <g stroke="#2a2a2a" stroke-linecap="square">
        <path d="M17 0v153M34 0v153M68 0v153M85 0v153M119 0v153M136 0v153" stroke-width="0.8" opacity="0.28"/>
        <path d="M0 17h153M0 34h153M0 68h153M0 85h153M0 119h153M0 136h153" stroke-width="0.8" opacity="0.28"/>
        <path d="M51 0v153M102 0v153M0 51h153M0 102h153" stroke-width="2.1" opacity="0.72"/>
        <rect width="153" height="153" fill="none" stroke-width="2.3" opacity="0.82"/>
      </g>

      <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif" text-anchor="middle">
        <g fill="#202124" font-size="12" font-weight="800">
          <text x="8.5" y="13">8</text>
          <text x="42.5" y="13">3</text>
          <text x="76.5" y="30">7</text>
          <text x="127.5" y="30">1</text>
          <text x="25.5" y="64">6</text>
          <text x="110.5" y="81">9</text>
          <text x="144.5" y="98">2</text>
          <text x="8.5" y="132">4</text>
          <text x="93.5" y="149">5</text>
        </g>
        <g fill="#1976d2" font-size="8" font-weight="800">
          <text x="76.5" y="115">4</text>
        </g>
        <g fill="#202124" font-size="5.2" font-weight="700" opacity="0.42">
          <text x="110" y="63">1</text><text x="119" y="63">4</text><text x="128" y="63">8</text>
          <text x="110" y="72">3</text><text x="119" y="72">6</text><text x="128" y="72">7</text>
          <text x="25" y="97">2</text><text x="34" y="97">5</text><text x="43" y="97">9</text>
          <text x="25" y="106">1</text><text x="34" y="106">7</text><text x="43" y="106">8</text>
          <text x="127" y="131">3</text><text x="136" y="131">6</text><text x="145" y="131">7</text>
          <text x="127" y="140">1</text><text x="136" y="140">4</text><text x="145" y="140">8</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(342 108)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif" fill="#202124">
    <g>
      <rect width="166" height="34" rx="6" fill="#ffffff" opacity="0.78"/>
      <circle cx="17" cy="17" r="4" fill="#1976d2" opacity="0.55"/>
      <text x="32" y="21" font-size="11" font-weight="800">Show Candidates</text>
    </g>
    <g transform="translate(0 48)">
      <rect width="166" height="34" rx="6" fill="#ffffff" opacity="0.70"/>
      <rect x="13" y="11" width="10" height="10" rx="2" fill="#1976d2" opacity="0.25" stroke="#1976d2" stroke-width="1.4"/>
      <text x="32" y="21" font-size="11" font-weight="800">Reveal Cell</text>
      <rect x="112" y="14" width="30" height="5" rx="2.5" opacity="0.12"/>
    </g>
    <g transform="translate(0 96)">
      <rect width="166" height="34" rx="6" fill="#ffffff" opacity="0.70"/>
      <rect x="12" y="10" width="14" height="14" rx="2" fill="#fb9b00" opacity="0.25"/>
      <path d="M12 17h14M19 10v14" stroke="#202124" stroke-width="1" opacity="0.22"/>
      <text x="32" y="21" font-size="11" font-weight="800">Reveal Box</text>
      <rect x="103" y="14" width="42" height="5" rx="2.5" opacity="0.12"/>
    </g>

    <g transform="translate(0 150)">
      <rect width="166" height="18" rx="5" fill="#ffffff" opacity="0.36"/>
      <rect x="15" y="7" width="42" height="4" rx="2" opacity="0.16"/>
      <rect x="70" y="7" width="26" height="4" rx="2" opacity="0.12"/>
      <rect x="109" y="7" width="34" height="4" rx="2" opacity="0.10"/>
    </g>
  </g>

  <rect x="224" y="282" width="192" height="1" fill="#000000" opacity="0.06"/>
</svg>
